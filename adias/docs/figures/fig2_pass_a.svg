<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <style>
      .title    { font: bold 18px 'PingFang SC','Microsoft YaHei','Heiti SC',sans-serif; fill:#222; }
      .stitle   { font: bold 14px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#0066cc; }
      .label    { font: 13px 'PingFang SC','Microsoft YaHei',sans-serif; text-anchor:middle; fill:#333; }
      .priority { font: bold 18px sans-serif; text-anchor:middle; fill:#d9534f; }
      .qmark    { font: bold 36px sans-serif; text-anchor:middle; fill:#d9534f; }
      .desc     { font: 13px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#333; }
      .warn     { font: 13px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#d9534f; }
      .scanned  { fill:#d4edda; stroke:#28a745; stroke-width:1.5; }
      .current  { fill:#fff3cd; stroke:#d9534f; stroke-width:2.5; }
      .un       { fill:#f0f0f0; stroke:#bbb; stroke-width:1; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0066cc"/>
    </marker>
  </defs>

  <text x="360" y="30" class="title" text-anchor="middle">图 2：Pass A — 首遍 4 邻居优先级标号</text>

  <!-- 3x3 grid -->
  <g transform="translate(70,70)">
    <rect x="0"   y="0"   width="90" height="90" class="scanned"/>
    <rect x="90"  y="0"   width="90" height="90" class="scanned"/>
    <rect x="180" y="0"   width="90" height="90" class="scanned"/>
    <rect x="0"   y="90"  width="90" height="90" class="scanned"/>
    <rect x="90"  y="90"  width="90" height="90" class="current"/>
    <rect x="180" y="90"  width="90" height="90" class="un"/>
    <rect x="0"   y="180" width="90" height="90" class="un"/>
    <rect x="90"  y="180" width="90" height="90" class="un"/>
    <rect x="180" y="180" width="90" height="90" class="un"/>

    <text x="45"  y="40"  class="label">左上</text>
    <text x="45"  y="64"  class="priority">③</text>

    <text x="135" y="40"  class="label">正上</text>
    <text x="135" y="64"  class="priority">②</text>

    <text x="225" y="40"  class="label">右上</text>
    <text x="225" y="64"  class="priority">①</text>

    <text x="45"  y="130" class="label">左</text>
    <text x="45"  y="154" class="priority">④</text>

    <text x="135" y="148" class="qmark">?</text>
  </g>

  <!-- Scan direction arrows -->
  <g transform="translate(380,80)">
    <text x="0" y="0" class="stitle">扫描方向</text>
    <line x1="0"  y1="20" x2="100" y2="20" stroke="#0066cc" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="0"  y1="50" x2="100" y2="50" stroke="#0066cc" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="0"  y1="80" x2="100" y2="80" stroke="#0066cc" stroke-width="2" marker-end="url(#arr)"/>
    <text x="120" y="55" class="desc">从上到下</text>
    <text x="120" y="75" class="desc">每行从左到右</text>
  </g>

  <!-- Logic explanation -->
  <g transform="translate(380,200)">
    <text x="0" y="0"  class="stitle">elseif 优先级链</text>
    <text x="0" y="22" class="desc">① 右上 &gt; ② 正上 &gt; ③ 左上 &gt; ④ 左</text>
    <text x="0" y="44" class="desc">取第一个 &gt; 0 的邻居 label 继承</text>
    <text x="0" y="66" class="desc">若 4 邻全 0：新建 numobj+1</text>
    <text x="0" y="92" class="warn">⚠ 不合并多个不同 label 的邻居</text>
    <text x="0" y="112" class="warn">    → 遗漏的等价关系交由 Pass C 修补</text>
  </g>

  <!-- Legend -->
  <g transform="translate(70,395)">
    <rect x="0"   y="0" width="22" height="22" class="scanned"/>
    <text x="32"  y="16" class="desc">已扫描 / 可继承 label</text>
    <rect x="200" y="0" width="22" height="22" class="current"/>
    <text x="232" y="16" class="desc">当前像素 ?</text>
    <rect x="370" y="0" width="22" height="22" class="un"/>
    <text x="402" y="16" class="desc">未扫描</text>
  </g>

  <text x="360" y="455" class="desc" text-anchor="middle">
    对应 Fortran 02detect.f90:255–340
  </text>
</svg>
