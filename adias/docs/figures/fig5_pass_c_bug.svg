<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <style>
      .title    { font: bold 18px 'PingFang SC','Microsoft YaHei','Heiti SC',sans-serif; fill:#222; }
      .stitle   { font: bold 14px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#0066cc; }
      .stitleW  { font: bold 14px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#cc7a00; }
      .desc     { font: 13px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#333; }
      .warn     { font: 13px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#d9534f; }
      .ok       { font: 13px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#28a745; }
      .code     { font: 13px 'JetBrains Mono','Menlo','Consolas',monospace; fill:#222; }
      .codeOK   { font: 13px 'JetBrains Mono','Menlo','Consolas',monospace; fill:#28a745; }
      .codeBad  { font: bold 13px 'JetBrains Mono','Menlo','Consolas',monospace; fill:#d9534f; }
      .box      { fill:#f8f9fa; stroke:#888; stroke-width:1.4; rx:8; ry:8; }
      .boxIn    { fill:#e7f3ff; stroke:#0066cc; stroke-width:1.6; rx:8; ry:8; }
      .boxBad   { fill:#fde8e8; stroke:#d9534f; stroke-width:1.6; rx:8; ry:8; }
      .boxOK    { fill:#e6f7ec; stroke:#28a745; stroke-width:1.6; rx:8; ry:8; }
      .arr      { stroke:#666; stroke-width:2; fill:none; }
      .nodeC    { fill:#0066cc; }
      .nodeT    { font: bold 13px sans-serif; fill:white; text-anchor:middle; }
      .edge     { stroke:#0066cc; stroke-width:2.5; }
      .th       { font: bold 13px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#222; }
      .td       { font: 13px 'JetBrains Mono','Menlo',monospace; fill:#222; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="450" y="30" class="title" text-anchor="middle">图 5：Pass C 简化合并的潜在 Bug</text>

  <!-- ========== Top: input ========== -->
  <g transform="translate(60,55)">
    <rect x="0" y="0" width="780" height="92" class="boxIn"/>
    <text x="14" y="22" class="stitle">输入：3 个等价对（语义上 {1,2,3,4} 应同根）</text>

    <!-- 4-node graph -->
    <g transform="translate(40,40)">
      <line x1="40"  y1="20" x2="120" y2="20" class="edge"/>
      <line x1="160" y1="20" x2="240" y2="20" class="edge"/>
      <line x1="280" y1="20" x2="360" y2="20" class="edge"/>
      <circle cx="20"  cy="20" r="18" class="nodeC"/>
      <circle cx="140" cy="20" r="18" class="nodeC"/>
      <circle cx="260" cy="20" r="18" class="nodeC"/>
      <circle cx="380" cy="20" r="18" class="nodeC"/>
      <text x="20"  y="25" class="nodeT">1</text>
      <text x="140" y="25" class="nodeT">2</text>
      <text x="260" y="25" class="nodeT">3</text>
      <text x="380" y="25" class="nodeT">4</text>
      <text x="80"  y="56" class="desc" text-anchor="middle">(1,2)</text>
      <text x="200" y="56" class="desc" text-anchor="middle">(2,3)</text>
      <text x="320" y="56" class="desc" text-anchor="middle">(3,4)</text>
    </g>

    <text x="510" y="50" class="desc">等价对到达顺序：</text>
    <text x="510" y="72" class="code" fill="#d9534f">[ (2,3), (1,2), (3,4) ]</text>
  </g>

  <line x1="450" y1="153" x2="450" y2="173" class="arr" marker-end="url(#arr)"/>

  <!-- ========== Middle: simplified union processing ========== -->
  <g transform="translate(60,178)">
    <rect x="0" y="0" width="780" height="180" class="box"/>
    <text x="14" y="22" class="stitleW">Fortran 简化合并过程（单遍线性扫描）</text>

    <!-- Step 1 -->
    <g transform="translate(20,40)">
      <text x="0" y="0" class="desc">处理 (2,3)：缓冲为空 → 直接存入</text>
      <text x="380" y="0" class="code" fill="#0066cc">缓冲 = [(2,3)]</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(20,72)">
      <text x="0" y="0" class="desc">处理 (1,2)：扫已存 [(2,3)]：1 ≠ 3 且 2 ≠ 3 → 不替换，原样存入</text>
      <text x="540" y="0" class="code" fill="#0066cc">缓冲 = [(2,3),(1,2)]</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(20,104)">
      <text x="0"   y="0" class="desc">处理 (3,4)：扫到 eid2[1]=3 == t1=3 → t1=eid1[1]=2 → 存入 (2,4)</text>
      <text x="540" y="0" class="codeBad">缓冲 = [(2,3),(1,2),(2,4)]</text>
    </g>

    <text x="20"  y="155" class="warn">→ 最终等价表：[(2,3), (1,2), (2,4)]   ⚠ 已丢失链 1→2→3→4 的传递性</text>
  </g>

  <line x1="450" y1="364" x2="450" y2="384" class="arr" marker-end="url(#arr)"/>

  <!-- ========== Bottom: replacement table comparison ========== -->
  <g transform="translate(60,388)">
    <rect x="0" y="0" width="780" height="240" class="box"/>
    <text x="14" y="22" class="stitle">全图替换结果对比</text>

    <!-- Table headers -->
    <line x1="20" y1="40" x2="760" y2="40" stroke="#888"/>
    <text x="100" y="60" class="th" text-anchor="middle">原 label</text>
    <text x="350" y="60" class="th" text-anchor="middle">Fortran 单遍替换过程</text>
    <text x="600" y="60" class="th" text-anchor="middle">Fortran 结果</text>
    <text x="720" y="60" class="th" text-anchor="middle">Union-Find</text>
    <line x1="20" y1="70" x2="760" y2="70" stroke="#888"/>

    <!-- Rows -->
    <text x="100" y="92"  class="td" text-anchor="middle">1</text>
    <text x="350" y="92"  class="td" text-anchor="middle">扫表均不匹配 e2</text>
    <text x="600" y="92"  class="td" text-anchor="middle">1</text>
    <text x="720" y="92"  class="codeOK" text-anchor="middle">1 ✓</text>

    <text x="100" y="118" class="td" text-anchor="middle">2</text>
    <text x="350" y="118" class="td" text-anchor="middle">(1,2)→1</text>
    <text x="600" y="118" class="td" text-anchor="middle">1</text>
    <text x="720" y="118" class="codeOK" text-anchor="middle">1 ✓</text>

    <text x="100" y="144" class="td" text-anchor="middle">3</text>
    <text x="350" y="144" class="td" text-anchor="middle">(2,3)→2 → (1,2)→1</text>
    <text x="600" y="144" class="td" text-anchor="middle">1</text>
    <text x="720" y="144" class="codeOK" text-anchor="middle">1 ✓</text>

    <text x="100" y="170" class="td" text-anchor="middle">4</text>
    <text x="350" y="170" class="td" text-anchor="middle">(2,3)/(1,2) 不匹配 → (2,4)→2 → 结束</text>
    <text x="600" y="170" class="codeBad" text-anchor="middle">2</text>
    <text x="720" y="170" class="codeOK"  text-anchor="middle">1 ✓</text>

    <line x1="20" y1="186" x2="760" y2="186" stroke="#888"/>

    <!-- Conclusion -->
    <text x="20" y="212" class="warn">⚠ 同一连通域被分裂：原 label = 1,2,3 的像素 → 1，但原 label = 4 的像素 → 2</text>
    <text x="20" y="232" class="ok">✓ scipy 用严格 Union-Find（路径压缩+按秩合并）总能正确合并所有可达 label 到同一根</text>
  </g>

  <text x="450" y="675" class="desc" text-anchor="middle">
    本场景在密集星场或长条形目标（拖尾、星轨）下偶发；紧凑圆形/椭圆星象不会触发。
  </text>
</svg>
