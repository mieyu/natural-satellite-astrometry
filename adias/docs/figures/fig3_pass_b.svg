<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640">
  <defs>
    <style>
      .title    { font: bold 18px 'PingFang SC','Microsoft YaHei','Heiti SC',sans-serif; fill:#222; }
      .stitle   { font: bold 14px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#0066cc; }
      .desc     { font: 13px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#333; }
      .warn     { font: 13px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#d9534f; }
      .axis     { font: 12px sans-serif; fill:#666; }
      .axisB    { font: bold 13px sans-serif; fill:#0066cc; }
      .anno     { font: 12px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#444; }
      .img-bg   { fill:#fafafa; stroke:#bbb; stroke-width:1; }
      .box-frame{ fill:#eaf3ff; stroke:#0066cc; stroke-width:2.6; stroke-dasharray:6,4; opacity:0.55; }
      .lab-left { fill:#ffc7c7; stroke:#d9534f; stroke-width:1; }
      .lab-cur  { fill:#b3d9ff; stroke:#0066cc; stroke-width:1; }
      .out-px   { fill:#ffc7c7; stroke:#888; stroke-width:1; opacity:0.85; }
      .pair-px  { stroke-width:2.5; }
      .excl     { fill:#7a7a7a; fill-opacity:0.18; }
      .arrow    { stroke:#d9534f; stroke-width:1.5; fill:none; }
      .arrowOK  { stroke:#28a745; stroke-width:1.5; fill:none; }
    </style>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9534f"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/>
    </marker>
  </defs>

  <text x="410" y="30" class="title" text-anchor="middle">图 3：Pass B — nr=250 子区域合并</text>
  <text x="410" y="55" class="desc" text-anchor="middle">触发点为中心 → 四向各 250 像素拉出 501×501 方框 → 框内同 label 像素就地改名</text>

  <!-- ====== Image canvas ====== -->
  <g transform="translate(60,80)">
    <!-- whole image canvas -->
    <rect x="0" y="0" width="700" height="460" class="img-bg"/>
    <text x="694" y="18" class="anno" text-anchor="end">整幅图（示意）</text>

    <!-- ±250 square box centered at trigger (cx=380, cy=240) -->
    <rect x="120" y="40" width="520" height="400" class="box-frame"/>
    <text x="380" y="35"  class="axisB" text-anchor="middle">↑ 上 250 像素</text>
    <text x="380" y="455" class="axisB" text-anchor="middle">↓ 下 250 像素</text>
    <text x="115" y="244" class="axisB" text-anchor="end">← 左 250 像素</text>
    <text x="645" y="244" class="axisB" text-anchor="start">右 250 像素 →</text>

    <!-- excluded row i and column j-1 (within the box) -->
    <rect x="120" y="232" width="520" height="20" class="excl"/>
    <rect x="368" y="40"  width="20"  height="400" class="excl"/>

    <!-- "label_left" pixels INSIDE box (will be renamed) -->
    <rect x="160" y="80"  width="20" height="20" class="lab-left"/>
    <rect x="200" y="120" width="20" height="20" class="lab-left"/>
    <rect x="280" y="170" width="20" height="20" class="lab-left"/>
    <rect x="500" y="100" width="20" height="20" class="lab-left"/>
    <rect x="540" y="180" width="20" height="20" class="lab-left"/>
    <rect x="180" y="320" width="20" height="20" class="lab-left"/>
    <rect x="240" y="380" width="20" height="20" class="lab-left"/>
    <rect x="500" y="350" width="20" height="20" class="lab-left"/>
    <rect x="580" y="400" width="20" height="20" class="lab-left"/>
    <rect x="440" y="160" width="20" height="20" class="lab-left"/>
    <rect x="320" y="120" width="20" height="20" class="lab-left"/>

    <!-- "label_left" pixels OUTSIDE box (will NOT change) -->
    <rect x="40"  y="60"  width="20" height="20" class="out-px"/>
    <rect x="60"  y="380" width="20" height="20" class="out-px"/>
    <rect x="660" y="100" width="20" height="20" class="out-px"/>
    <rect x="660" y="380" width="20" height="20" class="out-px"/>
    <text x="40"  y="55"  class="anno">框外</text>
    <text x="660" y="92"  class="anno">框外</text>

    <!-- Trigger pair pixels at row i (y=232..252), columns j-1 (x=368..388) and j (x=388..408) -->
    <rect x="368" y="232" width="20" height="20" class="lab-left pair-px" stroke="#ff6600"/>
    <rect x="388" y="232" width="20" height="20" class="lab-cur  pair-px" stroke="#ff6600"/>

    <!-- Pointer to trigger -->
    <line x1="500" y1="270" x2="412" y2="248" class="arrow" marker-end="url(#arrR)"/>
    <text x="505" y="285" class="warn">触发位置</text>
    <text x="505" y="302" class="anno">(i, j-1) 红 ↔ (i, j) 蓝</text>
    <text x="505" y="319" class="anno">label 不同 → 启动 Pass B</text>

    <!-- arrows showing red→blue rename for in-box pixels (sample 3 arrows) -->
    <line x1="170" y1="100" x2="378" y2="240" class="arrowOK" marker-end="url(#arrG)"/>
    <line x1="290" y1="190" x2="378" y2="240" class="arrowOK" marker-end="url(#arrG)"/>
    <line x1="510" y1="120" x2="398" y2="240" class="arrowOK" marker-end="url(#arrG)"/>
    <line x1="190" y1="340" x2="378" y2="252" class="arrowOK" marker-end="url(#arrG)"/>
    <line x1="510" y1="370" x2="398" y2="252" class="arrowOK" marker-end="url(#arrG)"/>
    <text x="270" y="280" class="anno" fill="#28a745">框内同 label 像素 → 全部改名</text>

    <!-- Annotation: excluded row/col -->
    <text x="650" y="246" class="anno" text-anchor="end">排除整行 i</text>
    <text x="378" y="442" class="anno" text-anchor="middle">排除整列 j-1</text>
  </g>

  <!-- ====== Legend ====== -->
  <g transform="translate(60,560)">
    <rect x="0"   y="0" width="20" height="20" class="lab-left"/>
    <text x="28"  y="15" class="desc">框内 label_left → 改名为 label_cur</text>

    <rect x="280" y="0" width="20" height="20" class="lab-cur"/>
    <text x="308" y="15" class="desc">label_cur（保留）</text>

    <rect x="460" y="0" width="20" height="20" class="out-px"/>
    <text x="488" y="15" class="desc">框外同 label → 不变</text>

    <rect x="640" y="0" width="20" height="20" class="excl"/>
    <text x="668" y="15" class="desc">排除区域</text>
  </g>

  <text x="410" y="615" class="warn" text-anchor="middle">
    若同一连通域跨度 &gt; 500 像素，Pass B 会漏掉远端 → 由 Pass C 等价表兜底合并
  </text>
</svg>
