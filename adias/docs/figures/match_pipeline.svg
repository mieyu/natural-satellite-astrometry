<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2680" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 28px; font-weight: bold; fill: #212529; }
    .subtitle { font-size: 18px; fill: #495057; }
    .stage-title { font-size: 22px; font-weight: bold; fill: #0c5460; }
    .stage-num { font-size: 36px; font-weight: bold; fill: #adb5bd; }
    .body { font-size: 15px; fill: #212529; }
    .small { font-size: 13px; fill: #495057; }
    .label-input { font-size: 14px; fill: #0c5460; font-weight: 600; }
    .label-output { font-size: 14px; fill: #155724; font-weight: 600; }
    .label-key { font-size: 16px; font-weight: bold; fill: #c92a2a; }
    .formula { font-family: 'Cambria Math','STIX Two Math',serif; font-size: 15px; fill: #212529; font-style: italic; }
    .panel-bg { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; }
    .input-box { fill: #d1ecf1; stroke: #0c5460; stroke-width: 1.5; }
    .output-box { fill: #d4edda; stroke: #155724; stroke-width: 1.5; }
    .solpar-box { fill: #fff3cd; stroke: #856404; stroke-width: 2; }
    .key-box { fill: #f8d7da; stroke: #c92a2a; stroke-width: 2; }
    .neutral-box { fill: white; stroke: #495057; stroke-width: 1; }
    .arrow-line { stroke: #495057; stroke-width: 1.8; fill: none; }
    .arrow-key-line { stroke: #c92a2a; stroke-width: 2.5; fill: none; }
  </style>

  <!-- ═══════════ Title ═══════════ -->
  <text x="700" y="50" text-anchor="middle" class="title">ADIAS 03match 星象匹配与天体归算流程</text>
  <text x="700" y="80" text-anchor="middle" class="subtitle">基于检测星、GAIA 星表与历表，求出目标天体在天球上的精确位置</text>

  <!-- ═══════════ sol_par 详解 ═══════════ -->
  <rect x="50" y="110" width="1300" height="290" rx="10" class="panel-bg"/>
  <text x="700" y="145" text-anchor="middle" class="stage-title">核心引擎 · sol_par 在做什么</text>

  <rect x="80" y="170" width="1240" height="210" rx="8" class="solpar-box"/>

  <text x="110" y="200" class="body" font-weight="bold">输入</text>
  <text x="110" y="225" class="body">  · N 组配对：图像上某点的<tspan fill="#0c5460" font-weight="bold">标准坐标 (ξ, η)</tspan> ↔ GAIA 星表上该点的<tspan fill="#0c5460" font-weight="bold">赤经赤纬 (α, δ)</tspan></text>
  <text x="110" y="248" class="body">  · 切平面投影所围绕的<tspan fill="#0c5460" font-weight="bold">球面中心 (α₀, δ₀)</tspan></text>
  <text x="110" y="271" class="body">  · 模型阶数（6/12/20/30）——决定多项式有多少项</text>

  <text x="110" y="305" class="body" font-weight="bold">求解</text>
  <text x="110" y="330" class="formula">       投影方程：    α_i ≈ f(底片常数, ξ_i, η_i; α₀, δ₀)        δ_i ≈ g(底片常数, ξ_i, η_i; α₀, δ₀)</text>
  <text x="110" y="355" class="body">  用<tspan font-weight="bold">最小二乘法</tspan>求一组底片常数，让"用它把每个 (ξ, η) 投影到天球"和"GAIA 真值"的总残差平方和最小。</text>

  <text x="110" y="378" class="body" font-weight="bold">输出</text>
  <text x="170" y="378" class="body">底片常数（30 维数组，前若干项有效） + 残差 σ（角秒，越小越好）</text>

  <!-- ═══════════ Stage 1 ═══════════ -->
  <rect x="50" y="430" width="1300" height="280" rx="10" class="panel-bg"/>
  <text x="80" y="475" class="stage-num">①</text>
  <text x="140" y="475" class="stage-title">盲匹配 · 找出"假设目标"</text>
  <text x="140" y="500" class="small">问题：完全不知道目标在图像哪个像素，也不知道精确的旋转/缩放。</text>

  <!-- Input -->
  <rect x="80" y="520" width="280" height="170" rx="6" class="input-box"/>
  <text x="95" y="545" class="label-input">输入</text>
  <text x="95" y="568" class="body">· 检测星列表（图像上所有亮点）</text>
  <text x="95" y="588" class="body">· GAIA 星表（视场内恒星）</text>
  <text x="95" y="608" class="body">· 历表预报的目标天球位置</text>
  <text x="95" y="635" class="body" font-weight="bold">· 初始底片常数（第 0 版）</text>
  <text x="95" y="655" class="small">  由配置文件旋转角构造的纯旋转矩阵，</text>
  <text x="95" y="673" class="small">  只对了"旋转"一项。</text>

  <!-- arrow -->
  <path d="M 360 605 L 430 605" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Process -->
  <rect x="430" y="520" width="540" height="170" rx="6" class="neutral-box"/>
  <text x="450" y="545" class="body" font-weight="bold">暴力枚举</text>
  <text x="450" y="568" class="body">逐颗把检测星当作"假设目标"，对每个假设：</text>
  <text x="450" y="592" class="body">  ① 以该检测星为像素原点，对其他检测星做</text>
  <text x="450" y="610" class="body">     标准坐标变换</text>
  <text x="450" y="635" class="body">  ② 用第 0 版底片常数把标准坐标投影到天球</text>
  <text x="450" y="660" class="body">  ③ 与 GAIA 逐颗比对，距离 ≤ 容差则算"配对"</text>
  <text x="450" y="683" class="body" fill="#c92a2a">取配对数最多的假设作为暂定结果</text>

  <path d="M 970 605 L 1040 605" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="1040" y="520" width="280" height="170" rx="6" class="output-box"/>
  <text x="1055" y="545" class="label-output">产出</text>
  <text x="1055" y="568" class="body">· 暂定的目标像素位置</text>
  <text x="1055" y="595" class="body">· 一批参考星配对：</text>
  <text x="1055" y="615" class="small">  每对包含一颗检测星的像素位置</text>
  <text x="1055" y="633" class="small">  和它认定的 GAIA 赤经赤纬</text>
  <text x="1055" y="665" class="small" fill="#c92a2a">这些是后续解算底片常数的"原料"</text>

  <!-- ═══════════ Stage 2 ═══════════ -->
  <rect x="50" y="740" width="1300" height="430" rx="10" class="panel-bg"/>
  <text x="80" y="785" class="stage-num">②</text>
  <text x="140" y="785" class="stage-title">精化底片常数 · 两次 sol_par</text>
  <text x="140" y="810" class="small">第 0 版底片常数太粗糙；用阶段一的参考星配对，正式拟合一组精确的底片常数。</text>

  <!-- Sub-stage 2a: first sol_par -->
  <rect x="80" y="830" width="600" height="155" rx="6" class="solpar-box"/>
  <text x="100" y="858" class="body" font-weight="bold">第一次 sol_par —— 过渡解</text>
  <text x="100" y="885" class="small">像素原点 = 暂定目标的像素位置</text>
  <text x="100" y="905" class="small">球面中心 = 历表预报的目标天球位置（粗糙，偏离视场中心若干角秒）</text>
  <text x="100" y="930" class="body">把所有参考星配对喂进 sol_par，解出</text>
  <text x="100" y="955" class="label-key">→ 第 1 版底片常数</text>
  <text x="100" y="975" class="small">作用：过渡解，<tspan font-weight="bold">仅用于下一步反推视场真实中心</tspan>。</text>

  <!-- Sub-stage 2b: compute centroid -->
  <rect x="700" y="830" width="280" height="155" rx="6" class="neutral-box"/>
  <text x="720" y="858" class="body" font-weight="bold">求参考星几何质心</text>
  <text x="720" y="890" class="small">把所有参考星的像素位置取平均，</text>
  <text x="720" y="910" class="body" fill="#0c5460" font-weight="bold">→ 参考星质心的像素位置</text>
  <text x="720" y="940" class="small">这一点通常很接近视场中心，</text>
  <text x="720" y="958" class="small">分布关于它最对称，是更</text>
  <text x="720" y="976" class="small">理想的"像素原点"。</text>

  <!-- arrow from 2a and 2b to 2c -->
  <path d="M 380 985 L 380 1010" class="arrow-line" marker-end="url(#arrow)"/>
  <path d="M 840 985 L 840 1010" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Sub-stage 2c: project centroid to sphere -->
  <rect x="1000" y="830" width="320" height="155" rx="6" class="neutral-box"/>
  <text x="1020" y="858" class="body" font-weight="bold">质心反投影到天球</text>
  <text x="1020" y="890" class="small">用第 1 版底片常数 + xy2rade，</text>
  <text x="1020" y="910" class="small">把"参考星质心的像素位置"</text>
  <text x="1020" y="930" class="small">投影到天球，得到</text>
  <text x="1020" y="955" class="body" fill="#0c5460" font-weight="bold">→ 参考星质心的天球位置</text>
  <text x="1020" y="975" class="small">这就是视场真实中心。</text>

  <path d="M 1160 985 L 1160 1010 L 380 1010 L 380 1030" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Sub-stage 2d: second sol_par -->
  <rect x="80" y="1030" width="1240" height="125" rx="6" class="solpar-box"/>
  <text x="100" y="1058" class="body" font-weight="bold">第二次 sol_par —— 局部精解</text>
  <text x="100" y="1085" class="small">像素原点 = 参考星质心的像素位置（视场中心）       球面中心 = 参考星质心的天球位置（视场中心对应的天球点）</text>
  <text x="100" y="1108" class="body">同一批参考星配对，换上更对称的原点/中心再做一次最小二乘</text>
  <text x="100" y="1135" class="label-key">→ 第 2 版底片常数（数值稳定，可全图使用）</text>

  <!-- ═══════════ Stage 3 ═══════════ -->
  <rect x="50" y="1200" width="1300" height="290" rx="10" class="panel-bg"/>
  <text x="80" y="1245" class="stage-num">③</text>
  <text x="140" y="1245" class="stage-title">全图再匹配 · 第三次 sol_par</text>
  <text x="140" y="1270" class="small">阶段一只对"假设目标周围的星"匹配过；现在有了可靠的第 2 版底片常数，能把整张图所有检测星都和 GAIA 对一遍。</text>

  <rect x="80" y="1295" width="600" height="170" rx="6" class="neutral-box"/>
  <text x="100" y="1323" class="body" font-weight="bold">全图遍历匹配</text>
  <text x="100" y="1350" class="small">对每颗检测星：</text>
  <text x="100" y="1375" class="body">  ① 以参考星质心为像素原点求标准坐标</text>
  <text x="100" y="1400" class="body">  ② 用第 2 版底片常数 + xy2rade 投影到天球</text>
  <text x="100" y="1425" class="body">  ③ 与整张 GAIA 比对，落入容差圈的全部记录</text>
  <text x="100" y="1450" class="small" fill="#c92a2a">通常能拿到比阶段一多得多的参考星配对</text>

  <path d="M 680 1380 L 750 1380" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="750" y="1295" width="570" height="170" rx="6" class="solpar-box"/>
  <text x="770" y="1323" class="body" font-weight="bold">第三次 sol_par —— 最终解</text>
  <text x="770" y="1350" class="small">像素原点和球面中心都沿用第二次的设置（视场中心）</text>
  <text x="770" y="1373" class="body">用"扩充后的参考星配对"再做一次最小二乘，</text>
  <text x="770" y="1395" class="small">由于参考星更多、覆盖更广，拟合更稳，残差更小。</text>
  <text x="770" y="1425" class="label-key">→ 第 3 版底片常数 ★★★ 最终用于归算 ★★★</text>
  <text x="770" y="1450" class="small">这是整个流程最重要的产物，也是后面所有变换的基础。</text>

  <!-- ═══════════ Stage 4 ═══════════ -->
  <rect x="50" y="1520" width="1300" height="430" rx="10" class="panel-bg"/>
  <text x="80" y="1565" class="stage-num">④</text>
  <text x="140" y="1565" class="stage-title">目标抓取与归算 · 反向投影</text>
  <text x="140" y="1590" class="small">现在有了精确的图像↔天球映射，可以"反过来用"——从历表的天球位置算出目标在图像上应该出现的像素，再去检测星里抓最近的那颗。</text>

  <!-- 4a -->
  <rect x="80" y="1610" width="380" height="320" rx="6" class="neutral-box"/>
  <text x="100" y="1638" class="body" font-weight="bold">A. 反算目标的预报像素位置</text>
  <text x="100" y="1668" class="small">第 1 步：历表给的目标天球位置</text>
  <text x="100" y="1688" class="small">         ↓ rade2xieta（球面投影）</text>
  <text x="100" y="1710" class="body" fill="#0c5460">      切平面标准坐标 (ξ, η)</text>
  <text x="100" y="1740" class="small">第 2 步：标准坐标 + 第 3 版底片常数</text>
  <text x="100" y="1760" class="small">         ↓ xieta2xy</text>
  <text x="100" y="1782" class="body" fill="#0c5460">      像素相对位移</text>
  <text x="100" y="1812" class="small">第 3 步：加上参考星质心的像素位置</text>
  <text x="100" y="1840" class="label-key">→ 目标的预报像素位置</text>
  <text x="100" y="1870" class="small">这是"目标按理论应该在图像哪里"</text>
  <text x="100" y="1888" class="small">的精确预测。</text>

  <path d="M 460 1770 L 530 1770" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- 4b -->
  <rect x="530" y="1610" width="380" height="320" rx="6" class="neutral-box"/>
  <text x="550" y="1638" class="body" font-weight="bold">B. 抓取真实目标</text>
  <text x="550" y="1670" class="small">遍历所有检测星，计算每颗到</text>
  <text x="550" y="1690" class="small">预报像素位置的距离。</text>
  <text x="550" y="1720" class="body">取距离 ≤ 3 像素且最近的那颗</text>
  <text x="550" y="1745" class="label-key">→ 目标的实测像素位置</text>
  <text x="550" y="1780" class="small">这是"图像上真的检测到的目标"。</text>
  <text x="550" y="1815" class="small">3 像素容差既能容忍底片残差和</text>
  <text x="550" y="1835" class="small">历表误差，又能防止抓错星——</text>
  <text x="550" y="1855" class="small">如果附近没有检测星，就标记</text>
  <text x="550" y="1875" class="small">"未找到目标"并跳过此图。</text>

  <path d="M 910 1770 L 980 1770" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- 4c -->
  <rect x="980" y="1610" width="340" height="320" rx="6" class="key-box"/>
  <text x="1000" y="1638" class="body" font-weight="bold">C. 实测位置反算天球坐标</text>
  <text x="1000" y="1670" class="small">用第 3 版底片常数 + xy2rade，</text>
  <text x="1000" y="1690" class="small">把目标的实测像素位置反算为</text>
  <text x="1000" y="1715" class="label-key">→ 目标的实测赤经赤纬</text>
  <text x="1000" y="1760" class="body" font-weight="bold" fill="#c92a2a">★★★ 这就是最终归算结果 ★★★</text>
  <text x="1000" y="1795" class="small">整个流程要回答的核心问题是：</text>
  <text x="1000" y="1815" class="small">"这颗天然卫星/小行星此刻</text>
  <text x="1000" y="1835" class="small"> 在天球上精确位于哪里？"</text>
  <text x="1000" y="1865" class="small">这个结果会被写入 object.out</text>
  <text x="1000" y="1885" class="small">文件，供轨道改进等后续工作。</text>

  <!-- ═══════════ Stage 5 ═══════════ -->
  <rect x="50" y="1980" width="1300" height="160" rx="10" class="panel-bg"/>
  <text x="80" y="2025" class="stage-num">⑤</text>
  <text x="140" y="2025" class="stage-title">自检 · 验证粗匹配是否选对了星</text>

  <rect x="80" y="2050" width="1240" height="75" rx="6" class="neutral-box"/>
  <text x="100" y="2078" class="body">对比阶段一暴力枚举认定的"暂定目标像素位置"和阶段四精确抓取的"目标实测像素位置"：</text>
  <text x="120" y="2103" class="small">· 差异 ≤ 0.001 像素 → 两者一致，说明粗匹配选对了 → 打印"确认目标==最终目标"</text>
  <text x="120" y="2122" class="small">· 差异 &gt; 0.001 像素 → 粗匹配选错了星（但精化流程已纠正） → 打印警告供人工核查</text>

  <!-- ═══════════ Geometric View ═══════════ -->
  <rect x="50" y="2170" width="1300" height="490" rx="10" class="panel-bg"/>
  <text x="700" y="2210" text-anchor="middle" class="stage-title">几何关系：两个坐标系，由第 3 版底片常数桥接</text>

  <!-- 天球 -->
  <text x="350" y="2250" text-anchor="middle" class="body" font-weight="bold">天球（赤经 α / 赤纬 δ）</text>
  <rect x="170" y="2265" width="360" height="320" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>

  <!-- GAIA stars -->
  <text x="220" y="2300" class="small" fill="#1c7ed6">★</text>
  <text x="290" y="2330" class="small" fill="#1c7ed6">★</text>
  <text x="380" y="2310" class="small" fill="#1c7ed6">★</text>
  <text x="450" y="2360" class="small" fill="#1c7ed6">★</text>
  <text x="200" y="2400" class="small" fill="#1c7ed6">★</text>
  <text x="320" y="2440" class="small" fill="#1c7ed6">★</text>
  <text x="420" y="2470" class="small" fill="#1c7ed6">★</text>
  <text x="240" y="2510" class="small" fill="#1c7ed6">★</text>
  <text x="380" y="2540" class="small" fill="#1c7ed6">★</text>
  <text x="470" y="2420" class="small" fill="#1c7ed6">★</text>

  <!-- Center cross -->
  <circle cx="350" cy="2425" r="10" fill="none" stroke="#c92a2a" stroke-width="2.5"/>
  <line x1="335" y1="2425" x2="365" y2="2425" stroke="#c92a2a" stroke-width="2"/>
  <line x1="350" y1="2410" x2="350" y2="2440" stroke="#c92a2a" stroke-width="2"/>
  <text x="370" y="2430" class="small" fill="#c92a2a" font-weight="bold">参考星质心的天球位置</text>
  <text x="370" y="2448" class="small" fill="#c92a2a">（= 切平面投影中心）</text>

  <!-- Target on sky -->
  <text x="280" y="2380" class="body" fill="#c92a2a" font-weight="bold">⊙</text>
  <text x="240" y="2367" class="small" fill="#c92a2a">目标（历表预报位置）</text>

  <text x="180" y="2570" class="small" fill="#495057">小蓝星 = GAIA 视场内恒星</text>

  <!-- Bidirectional arrow -->
  <path d="M 570 2350 L 830 2350" class="arrow-key-line" marker-end="url(#arrow-key)"/>
  <path d="M 830 2480 L 570 2480" class="arrow-key-line" marker-end="url(#arrow-key)"/>
  <text x="700" y="2335" text-anchor="middle" class="small" fill="#c92a2a" font-weight="bold">xy2rade · 像素→天球</text>
  <text x="700" y="2412" text-anchor="middle" class="label-key">第 3 版底片常数</text>
  <text x="700" y="2432" text-anchor="middle" class="small" fill="#c92a2a">（连接两个坐标系的桥梁）</text>
