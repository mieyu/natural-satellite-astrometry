<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540">
  <defs>
    <style>
      .title  { font: bold 18px 'PingFang SC','Microsoft YaHei','Heiti SC',sans-serif; fill:#222; }
      .stnum  { font: bold 16px sans-serif; fill:#0066cc; }
      .stnum2 { font: bold 16px sans-serif; fill:#cc7a00; }
      .sttxt  { font: 13px 'PingFang SC','Microsoft YaHei',sans-serif; fill:#333; }
      .code   { font: 13px 'JetBrains Mono','Menlo','Consolas',monospace; fill:#222; }
      .stbox  { fill:#e7f3ff; stroke:#0066cc; stroke-width:2; rx:10; ry:10; }
      .stbox2 { fill:#fff3cd; stroke:#ff9800; stroke-width:2.4; rx:10; ry:10; }
      .arrL   { stroke:#666; stroke-width:2; fill:none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="390" y="32" class="title" text-anchor="middle">图 4：Pass C — 等价表合并 5 步流程</text>

  <!-- Step 1 -->
  <g transform="translate(80,60)">
    <rect x="0" y="0" width="620" height="74" class="stbox"/>
    <text x="20" y="28" class="stnum">① 等价对收集</text>
    <text x="20" y="52" class="sttxt">扫每个 &gt; 0 像素，对 8 邻居中 label 不同且 &gt; 0 的，</text>
    <text x="20" y="68" class="sttxt">记录等价对 (min_label, max_label) → 列表 pairs1</text>
  </g>
  <line x1="390" y1="138" x2="390" y2="158" class="arrL" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <g transform="translate(80,162)">
    <rect x="0" y="0" width="620" height="58" class="stbox"/>
    <text x="20" y="26" class="stnum">② 去重 (1)</text>
    <text x="20" y="48" class="sttxt">按字符串去重，保留首次出现顺序 → pairs2</text>
  </g>
  <line x1="390" y1="224" x2="390" y2="244" class="arrL" marker-end="url(#arr)"/>

  <!-- Step 3 (highlighted) -->
  <g transform="translate(80,248)">
    <rect x="0" y="0" width="620" height="98" class="stbox2"/>
    <text x="20" y="26" class="stnum2">③ 简化合并（关键步骤，潜在 bug 来源）</text>
    <text x="20" y="50" class="sttxt">对每对 (t1, t2)，单遍线性扫描已存对：</text>
    <text x="40" y="72" class="code">if  t1 == eid2[j]: t1 = eid1[j]; break</text>
    <text x="40" y="90" class="code">elif t2 == eid2[j]: t2 = t1; t1 = eid1[j]; break</text>
  </g>
  <line x1="390" y1="350" x2="390" y2="370" class="arrL" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <g transform="translate(80,374)">
    <rect x="0" y="0" width="620" height="58" class="stbox"/>
    <text x="20" y="26" class="stnum">④ 去重 (2)</text>
    <text x="20" y="48" class="sttxt">再次按字符串去重 → pairs4</text>
  </g>
  <line x1="390" y1="436" x2="390" y2="456" class="arrL" marker-end="url(#arr)"/>

  <!-- Step 5 -->
  <g transform="translate(80,460)">
    <rect x="0" y="0" width="620" height="58" class="stbox"/>
    <text x="20" y="26" class="stnum">⑤ 全图替换</text>
    <text x="20" y="48" class="sttxt">对每个 &gt; 0 像素，按 pairs4 顺序逐对检查并替换 idbox2</text>
  </g>
</svg>
