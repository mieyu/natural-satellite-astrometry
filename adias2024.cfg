[1]#######pre cfg参数说明开始...##########
;***1）fits图像路径请在fitspath.in中写明，可写多行，程序会自动处理(..:obs/SHAO/200608/20060818/fits;bias;dark;flat)
;***2）预处理提供四种类型：biasflag/darkflag/flatflag/superflag:（注意，只要superflag为1，优先使用super模式）
;************************0001（super模式）；0010（仅flat模式）；1110（bias/dark/flat模式）；0000（不预处理模式）
;***3）中值滤波窗口半径=视场星象FWHM*（2~3），本程序可设med_length*med_width矩形滤波
;***4）中值滤波后的背景扣除模式选择：1：除法：newmdat(seqnum)=mdat(seqnum)/newfmdat(seqnum)*bkgd0
;**********************************：2：减法：newmdat(seqnum)=mdat(seqnum)-newfmdat(seqnum)+bkgd0
;***5）enhanceflag:图像增强开关，平场修正后，可选择是否图像增强（八邻域像素均值赋值）
;*******************如果图像增强，注意2bkgdthreshold\参数需要设稍大一些（若太小检测星象太多）
[1]#######pre cfg参数说明结束...##########+

1biasflag=0
1darkflag=0
1flatflag=0
1superflag=1
1med_length=65
1med_width=1
1bkgdmode=2
1enhance_flag=1

[2]#######detect cfg参数说明开始...##########
;***1)bkgd_threshold背景阈值系数，值越大，检测到星越少，3.0会将边缘认为星，5.0较好
;**************(mdat(i)-(bkgd+bkgd_threshold*bkgdsigma))
;***2)snr_threshold控制输出星象的信噪比，根据情况，星多可大一些，星少可以小一点
;*************snr=sumi_real(k)/sqrt(sumi_real(k)+numpix(i)*(bkgdsigma**2)) !yuyong
;***3)pos_method星象中心定位算法：1-修正矩；2-二阶修正矩；3-三阶修正矩。。。
[2]#######detect cfg参数说明结束...##########

2bkgd_threshold=5.0
2snr_threshold=1.0
2pos_method=1

[3]#######match cfg参数说明开始...##########
;***1)tele_label:望远镜标签，不同望远镜头文件格式不同：ss156/km100/lj214/ls365/xl80/lj240
;***2)tele_focal:望远镜焦距(mm)
;***3)ccd_scale:观测系统CCD设备像素尺寸（in mm）
;***4)ccd_fieldsize:观测系统视场大小，此处长宽默认相同（in arcmin）
;***4)modeltype:底片常数模型（可选6,12,20）
;***5)plate_angle:底片旋转角初值，若已知可直接写，不知道可以设0，程序自动去确定（注意观测当天CCD没有旋转过）
;***6)obj_ephsource:历表来源，可以选择IMCCE或者JPL，注意都是大写
;***7)obj_ephfile:历表文件注意下载历表时的文件格式，格式说明在adias程序说明文件中
;***8)gaia_catfile:历表文件注意下载星表时的文件格式，格式说明在adias程序说明文件中
;***9)gaia_minmag:参考星星等设置（提取星表中恒星时用）
;***10)gaia_maxmag:参考星星等设置（提取星表中恒星时用）
;***11)match_limit:匹配限（大于此值认为匹配不成功 in arcsec）
;***12)delta_T:可用于由于头文件时间与真实事件有差异的时间补偿（一般不用，某年份156tele可能会用）
[3]#######match cfg参数说明结束...##########

3tele_label=km100B
3tele_focal=13300.0
3ccd_scale=0.0135
3ccd_fieldsize=15
3modeltype=6
3plate_angle=180.0
3obj_ephsource=IMCCE
3gaia_minmag=5.0
3gaia_maxmag=18.5
3match_limit=5.0
3delta_T=0.0
3obj_total=1
3obj_ephfile1=/Users/liuhongyu/PythonProject/AstroPyFITS/lhycat_S\EPH_S9_202411.DAT
3gaia_catfile1=/Users/liuhongyu/PythonProject/AstroPyFITS/lhycat_S\GAIA3_S9_202410.DAT

[4]#######com_oc cfg 参数说明开始...##########
;***1)specified-output:放置最终数据输出文件夹的路径（到文件夹如D:\00adias\exe\DATA）
;***2)eps:对于match文件获得的O-C结果，要求其必须小于某个数值（此值设置需谨慎）
;***3)std_limit:数据剔除标准：标准偏差的系数
;***4)mean_limit:使用平均值法，保证平均值在0.03角秒内（一般不用，特殊情况除外）
;***5)del_flag:是否删除过程文件，主要指图像文件夹内生成的过程图像文件及reg文件等
[4]#######com_oc cfg 参数说明结束...##########

4specified-output=/Users/liuhongyu/PythonProject/AstroPyFITS/MATH_S
4eps=0.2
4std_limit=2.6
4mean_limit=0
4del_flag=0

