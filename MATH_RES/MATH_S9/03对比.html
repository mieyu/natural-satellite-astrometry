<!-- 该代码用于比对 Fortran 与 Python 程序的底片匹配结果，并直观展示匹配差异与成功率 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天文图像匹配数据比对系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-success { background-color: #dcfce7; color: #166534; }
        .status-fail { background-color: #fee2e2; color: #991b1b; }
        .conflict { border: 2px solid #ea580c !important; }
        .diff-tag { background-color: #ea580c; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-800">底片匹配数据比对报告</h1>
            <p class="text-gray-600 mt-2">对比 Fortran (旧版) 与 Python (新版) 算法的处理一致性</p>
            <div class="flex gap-4 mt-4">
                <div class="bg-white p-3 rounded shadow-sm border">
                    <span class="text-sm text-gray-500">总处理数量</span>
                    <div class="text-xl font-bold">63 幅</div>
                </div>
                <div class="bg-orange-50 p-3 rounded shadow-sm border border-orange-200">
                    <span class="text-sm text-orange-600 font-medium">结果冲突项</span>
                    <div id="conflict-count" class="text-xl font-bold text-orange-700">计算中...</div>
                </div>
            </div>
        </header>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden border">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-100 text-gray-700 font-medium text-sm">
                        <tr>
                            <th class="p-4 border-b">图像编号</th>
                            <th class="p-4 border-b bg-blue-50">Fortran 结果</th>
                            <th class="p-4 border-b bg-green-50">Python 结果</th>
                            <th class="p-4 border-b">比对结论</th>
                        </tr>
                    </thead>
                    <tbody id="data-body" class="text-sm">
                        <!-- JS 填充 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 基于提供的数据进行结构化
        const fortranData = {
            "001": { success: true, count: 12, sigma: 0.035, xy: "1136.3, 673.9" },
            "002": { success: true, count: 12, sigma: 0.034, xy: "1128.8, 683.2" },
            "003": { success: true, count: 12, sigma: 0.027, xy: "1127.5, 683.8" },
            "004": { success: false, reason: "检测星少于3颗" },
            "005": { success: false, reason: "匹配失败" },
            "006": { success: true, count: 12, sigma: 0.037, xy: "1124.1, 686.1" },
            "007": { success: true, count: 12, sigma: 0.021, xy: "1121.9, 686.0" },
            "008": { success: true, count: 12, sigma: 0.037, xy: "1120.5, 686.5" },
            "009": { success: true, count: 12, sigma: 0.024, xy: "1117.3, 687.5" },
            "010": { success: true, count: 12, sigma: 0.030, xy: "1115.8, 687.9" },
            "011": { success: true, count: 12, sigma: 0.024, xy: "1114.0, 689.8" },
            "012": { success: true, count: 12, sigma: 0.033, xy: "1114.0, 690.3" },
            "048": { success: true, count: 10, sigma: 0.114, xy: "1052.6, 714.0" },
            "049": { success: true, count: 11, sigma: 0.156, xy: "1051.2, 714.1" },
            "050": { success: true, count: 11, sigma: 0.157, xy: "1051.0, 714.2" },
            "051": { success: true, count: 10, sigma: 0.199, xy: "1049.7, 716.3" },
            "052": { success: true, count: 10, sigma: 0.320, xy: "1046.0, 717.0" },
            "054": { success: true, count: 9, sigma: 0.049, xy: "1041.3, 717.1" },
            "055": { success: true, count: 10, sigma: 0.389, xy: "1044.1, 718.2" },
            "056": { success: true, count: 10, sigma: 0.408, xy: "1044.0, 719.2" },
            "059": { success: true, count: 9, sigma: 0.036, xy: "1032.8, 720.4" },
            "060": { success: true, count: 10, sigma: 0.032, xy: "1031.6, 721.4" },
            "061": { success: true, count: 10, sigma: 0.025, xy: "1032.0, 722.3" },
            "062": { success: true, count: 10, sigma: 0.026, xy: "1028.6, 723.1" }
        };

        const pythonData = {
            "001": { success: true, count: 18, sigma: 0.024, xy: "1136.7, 673.8" },
            "002": { success: true, count: 18, sigma: 0.038, xy: "1128.6, 683.5" },
            "003": { success: true, count: 18, sigma: 0.035, xy: "1127.4, 684.2" },
            "004": { success: false, reason: "未找到目标" },
            "005": { success: true, count: 18, sigma: 0.033, xy: "1125.4, 685.3" },
            "006": { success: true, count: 18, sigma: 0.047, xy: "1123.9, 686.1" },
            "007": { success: true, count: 18, sigma: 0.023, xy: "1121.8, 686.3" },
            "008": { success: true, count: 18, sigma: 0.041, xy: "1120.5, 686.8" },
            "031": { success: true, count: 1, sigma: "N/A", xy: "未给出" },
            "051": { success: true, count: 1, sigma: "N/A", xy: "未给出" },
            "061": { success: true, count: 1, sigma: "N/A", xy: "未给出" }
        };

        const body = document.getElementById('data-body');
        let conflicts = 0;

        for (let i = 1; i <= 63; i++) {
            const key = i.toString().padStart(3, '0');
            const f = fortranData[key] || { success: false, reason: "无匹配/失败" };
            const p = pythonData[key] || { success: false, reason: "无匹配/未找到目标" };

            const isConflict = f.success !== p.success;
            if (isConflict) conflicts++;

            const row = document.createElement('tr');
            row.className = `border-b hover:bg-gray-50 ${isConflict ? 'bg-orange-50' : ''}`;

            row.innerHTML = `
                <td class="p-4 font-mono font-bold text-gray-500">${key}</td>
                <td class="p-4 ${f.success ? 'status-success' : 'status-fail'}">
                    <div class="font-bold">${f.success ? '成功' : '失败'}</div>
                    ${f.success ? `<div class="text-xs">星数: ${f.count} | Sigma: ${f.sigma}</div>` : `<div class="text-xs">${f.reason}</div>`}
                </td>
                <td class="p-4 ${p.success ? 'status-success' : 'status-fail'}">
                    <div class="font-bold">${p.success ? '成功' : '失败'}</div>
                    ${p.success ? `<div class="text-xs">星数: ${p.count} | Sigma: ${p.sigma}</div>` : `<div class="text-xs">${p.reason}</div>`}
                </td>
                <td class="p-4">
                    ${isConflict ?
                        `<span class="diff-tag">结果冲突</span><br><span class="text-xs text-orange-700 font-medium">${f.success ? 'F成功而P失败' : 'P成功而F失败'}</span>` :
                        `<span class="text-gray-400 text-xs">一致</span>`
                    }
                </td>
            `;
            body.appendChild(row);
        }

        document.getElementById('conflict-count').innerText = conflicts + " 项";
    </script>
</body>
</html>
