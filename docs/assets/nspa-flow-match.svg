<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc">
<title id="title">NSPA 参考星匹配与底片归算</title>
<desc id="desc">参考星匹配与底片归算。输入：检测星象表；GAIA DR3 星表；IMCCE 卫星历表。处理顺序：预报与取星 → 自动配对 → 底片常数 → 定位与归算。输出：目标 RA / Dec；参考星表；底片拟合 σ。底片模型可选 6 / 12 / 20 项；同一帧的后续目标复用已求得的底片常数。 底片常数只在内部使用，不写回 FITS 头，不生成 WCS。</desc>
<defs>
<marker id="arrow-pre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-detect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-match" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-comoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB','Source Han Sans SC',sans-serif">
<rect width="1040" height="720" fill="#ffffff"/>
<text x="32" y="65" font-size="28" font-weight="500" fill="#222222" text-anchor="start">(3)</text>
<text x="104" y="66" font-size="30" font-weight="600" fill="#222222" text-anchor="start">参考星匹配与底片归算</text>
<text x="104" y="103" font-size="21" font-weight="400" fill="#555555" text-anchor="start">用 GAIA 恒星建立像素与天球坐标的对应，定位天然卫星</text>
<path d="M 32 118 L 1008 118" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<rect x="32" y="140" width="976" height="96" fill="#f7f7f7" stroke="#999999" stroke-width="1.2"/>
<text x="52" y="170" font-size="18" font-weight="600" fill="#555555" text-anchor="start">输入</text>
<text x="132.0" y="178" font-size="23" font-weight="600" fill="#222222" text-anchor="start">检测星象表</text>
<text x="132.0" y="211" font-size="20" font-weight="400" fill="#555555" text-anchor="start">(x, y)、流量、SNR</text>
<text x="417.3333333333333" y="178" font-size="23" font-weight="600" fill="#222222" text-anchor="start">GAIA DR3 星表</text>
<text x="417.3333333333333" y="211" font-size="20" font-weight="400" fill="#555555" text-anchor="start">位置、自行、G 星等</text>
<path d="M 397.3333333333333 161 L 397.3333333333333 218" fill="none" stroke="#999999" stroke-width="1.5"/>
<text x="702.6666666666666" y="178" font-size="23" font-weight="600" fill="#222222" text-anchor="start">IMCCE 卫星历表</text>
<text x="702.6666666666666" y="211" font-size="20" font-weight="400" fill="#555555" text-anchor="start">曝光中点位置插值</text>
<path d="M 682.6666666666666 161 L 682.6666666666666 218" fill="none" stroke="#999999" stroke-width="1.5"/>
<path d="M 260.66666666666663 236 L 260.66666666666663 254" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M 546.0 236 L 546.0 254" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M 831.3333333333333 236 L 831.3333333333333 254" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M 145 254 L 831.3333333333333 254" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M 145 254 L 145 270" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-match)"/>
<rect x="32" y="278" width="226" height="226" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="52" y="320" font-size="18" font-weight="500" fill="#555555" text-anchor="start">01</text>
<text x="52" y="365" font-size="23" font-weight="600" fill="#222222" text-anchor="start">预报与取星</text>
<path d="M 52 384 L 238 384" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<text x="52" y="418" font-size="21" font-weight="400" fill="#555555" text-anchor="start">插值历表位置</text>
<text x="52" y="447" font-size="21" font-weight="400" fill="#555555" text-anchor="start">截取视场恒星</text>
<text x="52" y="476" font-size="21" font-weight="400" fill="#555555" text-anchor="start">自行改正到历元</text>
<path d="M 261 391 L 277 391" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-match)"/>
<rect x="282" y="278" width="226" height="226" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="302" y="320" font-size="18" font-weight="500" fill="#555555" text-anchor="start">02</text>
<text x="302" y="365" font-size="23" font-weight="600" fill="#222222" text-anchor="start">自动配对</text>
<path d="M 302 384 L 488 384" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<text x="302" y="418" font-size="21" font-weight="400" fill="#555555" text-anchor="start">逐颗假设目标</text>
<text x="302" y="447" font-size="21" font-weight="400" fill="#555555" text-anchor="start">按尺度与旋转</text>
<text x="302" y="476" font-size="21" font-weight="400" fill="#555555" text-anchor="start">取最多匹配者</text>
<path d="M 511 391 L 527 391" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-match)"/>
<rect x="532" y="278" width="226" height="226" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="552" y="320" font-size="18" font-weight="500" fill="#555555" text-anchor="start">03</text>
<text x="552" y="365" font-size="23" font-weight="600" fill="#222222" text-anchor="start">底片常数</text>
<path d="M 552 384 L 738 384" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<text x="552" y="418" font-size="21" font-weight="400" fill="#555555" text-anchor="start">最小二乘求解</text>
<text x="552" y="447" font-size="21" font-weight="400" fill="#555555" text-anchor="start">2.6σ 迭代剔除</text>
<text x="552" y="476" font-size="21" font-weight="400" fill="#555555" text-anchor="start">全图重配再拟合</text>
<path d="M 761 391 L 777 391" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-match)"/>
<rect x="782" y="278" width="226" height="226" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="802" y="320" font-size="18" font-weight="500" fill="#555555" text-anchor="start">04</text>
<text x="802" y="365" font-size="23" font-weight="600" fill="#222222" text-anchor="start">定位与归算</text>
<path d="M 802 384 L 988 384" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<text x="802" y="418" font-size="21" font-weight="400" fill="#555555" text-anchor="start">历表反算像素</text>
<text x="802" y="447" font-size="21" font-weight="400" fill="#555555" text-anchor="start">≤ 3 px 最近源</text>
<text x="802" y="476" font-size="21" font-weight="400" fill="#555555" text-anchor="start">换算 RA / Dec</text>
<path d="M 895 504 L 895 538" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-match)"/>
<rect x="32" y="546" width="976" height="90" fill="#f7f7f7" stroke="#999999" stroke-width="1.2"/>
<text x="52" y="578" font-size="18" font-weight="600" fill="#555555" text-anchor="start">输出</text>
<text x="132.0" y="579" font-size="23" font-weight="600" fill="#222222" text-anchor="start">目标 RA / Dec</text>
<text x="132.0" y="611" font-size="20" font-weight="400" fill="#555555" text-anchor="start">O−C = 实测 − 历表</text>
<path d="M 397.3333333333333 564 L 397.3333333333333 618" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<text x="417.3333333333333" y="579" font-size="23" font-weight="600" fill="#222222" text-anchor="start">参考星表</text>
<text x="417.3333333333333" y="611" font-size="20" font-weight="400" fill="#555555" text-anchor="start">DS9 region · 红圈</text>
<path d="M 682.6666666666666 564 L 682.6666666666666 618" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<text x="702.6666666666666" y="579" font-size="23" font-weight="600" fill="#222222" text-anchor="start">底片拟合 σ</text>
<text x="702.6666666666666" y="611" font-size="20" font-weight="400" fill="#555555" text-anchor="start">逐帧输出</text>
<text x="32" y="672" font-size="20" font-weight="400" fill="#555555" text-anchor="start">底片模型可选 6 / 12 / 20 项；同一帧的后续目标复用已求得的底片常数。</text>
<text x="32" y="701" font-size="20" font-weight="400" fill="#555555" text-anchor="start">底片常数只在内部使用，不写回 FITS 头，不生成 WCS。</text>
</g>
</svg>
