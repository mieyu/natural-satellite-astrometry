<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 614" width="1600" height="614" role="img" aria-labelledby="t d">
<title id="t">NSPA ① 图像预处理</title><desc id="d">① 图像预处理：压平天空背景与大尺度结构，保留星象。输入：原始 CCD 图像；输出：平坦背景图像。</desc>
<defs>
<marker id="ah-pre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8f7e"/></marker>
<marker id="ah-detect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c26a00"/></marker>
<marker id="ah-match" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker>
<marker id="ah-comoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a63d8c"/></marker>
<marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
</defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC',sans-serif;fill:#1f2328}</style>
<rect width="1600" height="614" fill="#ffffff"/>
<rect x="0" y="0" width="12" height="614" rx="0" fill="#0e8f7e" stroke="none" stroke-width="1.5"/>
<text x="44" y="62" font-size="34" font-weight="700" fill="#0e8f7e" text-anchor="start">① 图像预处理</text>
<text x="278.08000000000004" y="62" font-size="21" font-weight="400" fill="#57606a" text-anchor="start">压平天空背景与大尺度结构，保留星象</text>
<rect x="44" y="112" width="300" height="406" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="68" y="156" font-size="20" font-weight="700" fill="#57606a" text-anchor="start">输入</text>
<text x="68" y="204" font-size="23" font-weight="700" fill="#1f2328" text-anchor="start">原始 CCD 图像</text>
<text x="68" y="234" font-size="17.5" font-weight="400" fill="#57606a" text-anchor="start">FITS，逐帧读取</text>
<text x="68" y="264" font-size="17.5" font-weight="400" fill="#57606a" text-anchor="start">背景含渐变、光晕、条纹</text>
<rect x="420" y="112" width="780" height="88" rx="14" fill="#e7f4f2" stroke="#0e8f7e" stroke-width="2"/>
<circle cx="466" cy="156.0" r="24" fill="#0e8f7e"/>
<text x="466" y="165.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="510" y="148" font-size="23" font-weight="700" fill="#1f2328" text-anchor="start">估计背景水平</text>
<text x="510" y="181" font-size="18.5" font-weight="400" fill="#1f2328" text-anchor="start">迭代 σ 裁剪，得到背景均值与噪声 σ</text>
<rect x="420" y="218" width="780" height="88" rx="14" fill="#e7f4f2" stroke="#0e8f7e" stroke-width="2"/>
<circle cx="466" cy="262.0" r="24" fill="#0e8f7e"/>
<text x="466" y="271.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="510" y="254" font-size="23" font-weight="700" fill="#1f2328" text-anchor="start">构建“超级背景”</text>
<text x="510" y="287" font-size="18.5" font-weight="400" fill="#1f2328" text-anchor="start">先沿行、再沿列做长窗口中值滤波，星象被滤掉，只剩背景</text>
<line x1="466" y1="199" x2="466" y2="216" stroke="#0e8f7e" stroke-width="2.5" marker-end="url(#ah-pre)"/>
<rect x="420" y="324" width="780" height="88" rx="14" fill="#e7f4f2" stroke="#0e8f7e" stroke-width="2"/>
<circle cx="466" cy="368.0" r="24" fill="#0e8f7e"/>
<text x="466" y="377.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="510" y="360" font-size="23" font-weight="700" fill="#1f2328" text-anchor="start">扣除背景</text>
<text x="510" y="393" font-size="18.5" font-weight="400" fill="#1f2328" text-anchor="start">原图减去超级背景，再加回背景均值，整体灰度水平不变</text>
<line x1="466" y1="305" x2="466" y2="322" stroke="#0e8f7e" stroke-width="2.5" marker-end="url(#ah-pre)"/>
<rect x="420" y="430" width="780" height="88" rx="14" fill="#e7f4f2" stroke="#0e8f7e" stroke-width="2"/>
<circle cx="466" cy="474.0" r="24" fill="#0e8f7e"/>
<text x="466" y="483.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="510" y="466" font-size="23" font-weight="700" fill="#1f2328" text-anchor="start">轻度平滑（可选）</text>
<text x="510" y="499" font-size="18.5" font-weight="400" fill="#1f2328" text-anchor="start">3×3 均值平滑，降低逐像素噪声</text>
<line x1="466" y1="411" x2="466" y2="428" stroke="#0e8f7e" stroke-width="2.5" marker-end="url(#ah-pre)"/>
<line x1="352" y1="315.0" x2="412" y2="315.0" stroke="#0e8f7e" stroke-width="3.5" marker-end="url(#ah-pre)"/>
<rect x="1280" y="112" width="276" height="406" rx="14" fill="#ffffff" stroke="#0e8f7e" stroke-width="3"/>
<text x="1304" y="156" font-size="20" font-weight="700" fill="#0e8f7e" text-anchor="start">输出</text>
<text x="1304" y="204" font-size="23" font-weight="700" fill="#1f2328" text-anchor="start">平坦背景图像</text>
<text x="1304" y="234" font-size="17.5" font-weight="400" fill="#57606a" text-anchor="start">FITS，与原图同尺寸</text>
<text x="1304" y="264" font-size="17.5" font-weight="400" fill="#57606a" text-anchor="start">像素坐标不变</text>
<line x1="1208" y1="315.0" x2="1272" y2="315.0" stroke="#0e8f7e" stroke-width="3.5" marker-end="url(#ah-pre)"/>
<text x="44" y="574" font-size="18" font-weight="400" fill="#57606a" text-anchor="start">本页示例：中值窗口 65 px、行→列串联、减法扣背景、开启 3×3 平滑。另可选同态滤波、双边 Retinex 两种背景处理方式。</text>
</svg>
