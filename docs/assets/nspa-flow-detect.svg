<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc">
<title id="title">NSPA 星象检测与定心</title>
<desc id="desc">星象检测与定心。输入：预处理图像。处理顺序：阈值分割 → 连通区域 → 修正矩定心 → 筛选星象。输出：星象表 · DS9 region。筛选条件：像素数 10–5026，排除 10 px 边框内与饱和星象，并应用 SNR 门限。 坐标采用 DS9 physical（1-based），可直接叠加到相同像素网格的图像上。</desc>
<defs>
<marker id="arrow-pre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-detect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-match" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-comoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB','Source Han Sans SC',sans-serif">
<rect width="1040" height="720" fill="#ffffff"/>
<text x="32" y="65" font-size="28" font-weight="500" fill="#222222" text-anchor="start">(2)</text>
<text x="104" y="66" font-size="30" font-weight="600" fill="#222222" text-anchor="start">星象检测与定心</text>
<text x="104" y="103" font-size="21" font-weight="400" fill="#555555" text-anchor="start">从图像中的连通亮区得到星象中心、流量与信噪比</text>
<path d="M 32 118 L 1008 118" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<rect x="32" y="140" width="976" height="96" fill="#f7f7f7" stroke="#999999" stroke-width="1.2"/>
<text x="52" y="170" font-size="18" font-weight="600" fill="#555555" text-anchor="start">输入</text>
<text x="132.0" y="178" font-size="23" font-weight="600" fill="#222222" text-anchor="start">预处理图像</text>
<text x="132.0" y="211" font-size="20" font-weight="400" fill="#555555" text-anchor="start">读取平坦背景 FITS · 跳过预处理时也可读取原图</text>
<path d="M 145 236 L 145 270" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-detect)"/>
<rect x="32" y="278" width="226" height="226" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="52" y="320" font-size="18" font-weight="500" fill="#555555" text-anchor="start">01</text>
<text x="52" y="365" font-size="23" font-weight="600" fill="#222222" text-anchor="start">阈值分割</text>
<path d="M 52 384 L 238 384" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<text x="52" y="418" font-size="21" font-weight="400" fill="#555555" text-anchor="start">背景 + k·σ</text>
<text x="52" y="447" font-size="21" font-weight="400" fill="#555555" text-anchor="start">保留阈值以上</text>
<text x="52" y="476" font-size="21" font-weight="400" fill="#555555" text-anchor="start">像素；示例 k = 5</text>
<path d="M 261 391 L 277 391" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-detect)"/>
<rect x="282" y="278" width="226" height="226" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="302" y="320" font-size="18" font-weight="500" fill="#555555" text-anchor="start">02</text>
<text x="302" y="365" font-size="23" font-weight="600" fill="#222222" text-anchor="start">连通区域</text>
<path d="M 302 384 L 488 384" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<text x="302" y="418" font-size="21" font-weight="400" fill="#555555" text-anchor="start">按 8 邻域连通</text>
<text x="302" y="447" font-size="21" font-weight="400" fill="#555555" text-anchor="start">将相连亮像素</text>
<text x="302" y="476" font-size="21" font-weight="400" fill="#555555" text-anchor="start">归为同一星象</text>
<path d="M 511 391 L 527 391" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-detect)"/>
<rect x="532" y="278" width="226" height="226" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="552" y="320" font-size="18" font-weight="500" fill="#555555" text-anchor="start">03</text>
<text x="552" y="365" font-size="23" font-weight="600" fill="#222222" text-anchor="start">修正矩定心</text>
<path d="M 552 384 L 738 384" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<text x="552" y="418" font-size="21" font-weight="400" fill="#555555" text-anchor="start">测定中心 (x, y)</text>
<text x="552" y="447" font-size="21" font-weight="400" fill="#555555" text-anchor="start">计算星象流量</text>
<text x="552" y="476" font-size="21" font-weight="400" fill="#555555" text-anchor="start">与信噪比 SNR</text>
<path d="M 761 391 L 777 391" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-detect)"/>
<rect x="782" y="278" width="226" height="226" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="802" y="320" font-size="18" font-weight="500" fill="#555555" text-anchor="start">04</text>
<text x="802" y="365" font-size="23" font-weight="600" fill="#222222" text-anchor="start">筛选星象</text>
<path d="M 802 384 L 988 384" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<text x="802" y="418" font-size="21" font-weight="400" fill="#555555" text-anchor="start">像素数与边缘</text>
<text x="802" y="447" font-size="21" font-weight="400" fill="#555555" text-anchor="start">饱和与 SNR</text>
<text x="802" y="476" font-size="21" font-weight="400" fill="#555555" text-anchor="start">逐项筛选</text>
<path d="M 895 504 L 895 538" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-detect)"/>
<rect x="32" y="546" width="976" height="90" fill="#f7f7f7" stroke="#999999" stroke-width="1.2"/>
<text x="52" y="578" font-size="18" font-weight="600" fill="#555555" text-anchor="start">输出</text>
<text x="132.0" y="579" font-size="23" font-weight="600" fill="#222222" text-anchor="start">星象表 · DS9 region</text>
<text x="132.0" y="611" font-size="20" font-weight="400" fill="#555555" text-anchor="start">中心 (x, y)、流量与 SNR · 按流量从亮到暗排列</text>
<text x="32" y="672" font-size="20" font-weight="400" fill="#555555" text-anchor="start">筛选条件：像素数 10–5026，排除 10 px 边框内与饱和星象，并应用 SNR 门限。</text>
<text x="32" y="701" font-size="20" font-weight="400" fill="#555555" text-anchor="start">坐标采用 DS9 physical（1-based），可直接叠加到相同像素网格的图像上。</text>
</g>
</svg>
