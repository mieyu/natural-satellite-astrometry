  <text x="70" y="423" font-size="14" class="b mono t" text-anchor="start">catalogs/</text>
  <text x="70" y="444" font-size="13.5" class="t" text-anchor="start">目标历表（IMCCE 格式）</text>
  <text x="70" y="463" font-size="12" class="m mono" text-anchor="start">EPH_*.DAT</text>
  <rect x="56" y="490" width="198" height="76" rx="9" class="box" stroke-width="1"/>
  <text x="70" y="515" font-size="14" class="b mono t" text-anchor="start">configs/</text>
