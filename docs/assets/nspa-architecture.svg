<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-labelledby="ttl desc">
  <title id="ttl">NSPA 整体架构</title>
  <desc id="desc">入口层、配置与应用层、流程编排层、领域算法与工具层、文件 I/O 层，以及 inputs 与 outputs 数据目录。</desc>
