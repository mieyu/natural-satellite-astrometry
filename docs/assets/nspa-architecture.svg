  <rect x="0" y="0" width="1600" height="960" rx="20" class="bg" stroke-width="1"/>
  <text x="40" y="62" font-size="30" class="b t" text-anchor="start">NSPA 整体架构</text>
  <text x="40" y="96" font-size="16" class="m" text-anchor="start">分层组织：入口只负责参数与调度，算法集中在 domain / utils，文件格式集中在 io。</text>
