<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="t d">
<title id="t">NSPA 总体数据流</title><desc id="d">原始 FITS 经图像预处理、星象检测、参考星匹配与底片归算、O-C 统计四个模块，得到目标天球位置与 O-C 残差；report 为辅助出图。</desc>
<defs>
<marker id="ah-pre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8f7e"/></marker>
<marker id="ah-detect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c26a00"/></marker>
<marker id="ah-match" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker>
<marker id="ah-comoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a63d8c"/></marker>
<marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
</defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC',sans-serif;fill:#1f2328}</style>
<rect width="1600" height="560" fill="#ffffff"/>
<text x="40" y="56" font-size="32" font-weight="700" fill="#1f2328" text-anchor="start">NSPA 总体数据流</text>
<text x="40" y="92" font-size="20" font-weight="400" fill="#57606a" text-anchor="start">一个观测夜目录为一个处理单元；四个核心模块依次运行，也可单独运行任一模块。</text>
<rect x="40" y="210" width="206" height="190" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="143.0" y="272" font-size="24" font-weight="700" fill="#1f2328" text-anchor="middle">原始 CCD 图像</text>
<text x="143.0" y="310" font-size="19" font-weight="400" fill="#57606a" text-anchor="middle">FITS，逐帧</text>
<text x="143.0" y="340" font-size="17" font-weight="400" fill="#57606a" text-anchor="middle">一个观测夜一个目录</text>
<rect x="306" y="210" width="206" height="190" rx="14" fill="#e7f4f2" stroke="#0e8f7e" stroke-width="2.5"/>
<rect x="306" y="210" width="206" height="58" rx="14" fill="#0e8f7e" stroke="none" stroke-width="1.5"/>
<rect x="306" y="250" width="206" height="18" rx="0" fill="#0e8f7e" stroke="none" stroke-width="1.5"/>
<text x="409.0" y="249" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">① 图像预处理</text>
<text x="409.0" y="306" font-size="19" font-weight="500" fill="#1f2328" text-anchor="middle">扣除天空背景</text>
<text x="409.0" y="360" font-size="17" font-weight="700" fill="#0e8f7e" text-anchor="middle">→ 平坦背景图像</text>
<line x1="252" y1="305.0" x2="300" y2="305.0" stroke="#0e8f7e" stroke-width="3" marker-end="url(#ah-pre)"/>
<rect x="572" y="210" width="206" height="190" rx="14" fill="#fbf0e3" stroke="#c26a00" stroke-width="2.5"/>
<rect x="572" y="210" width="206" height="58" rx="14" fill="#c26a00" stroke="none" stroke-width="1.5"/>
<rect x="572" y="250" width="206" height="18" rx="0" fill="#c26a00" stroke="none" stroke-width="1.5"/>
<text x="675.0" y="249" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">② 星象检测</text>
<text x="675.0" y="300" font-size="19" font-weight="500" fill="#1f2328" text-anchor="middle">阈值分割</text>
<text x="675.0" y="326" font-size="19" font-weight="500" fill="#1f2328" text-anchor="middle">修正矩定心</text>
<text x="675.0" y="360" font-size="17" font-weight="700" fill="#c26a00" text-anchor="middle">→ 星象表 (x, y, SNR)</text>
<line x1="518" y1="305.0" x2="566" y2="305.0" stroke="#c26a00" stroke-width="3" marker-end="url(#ah-detect)"/>
<rect x="838" y="210" width="206" height="190" rx="14" fill="#e9f0fb" stroke="#2f6fd6" stroke-width="2.5"/>
<rect x="838" y="210" width="206" height="58" rx="14" fill="#2f6fd6" stroke="none" stroke-width="1.5"/>
<rect x="838" y="250" width="206" height="18" rx="0" fill="#2f6fd6" stroke="none" stroke-width="1.5"/>
<text x="941.0" y="249" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">③ 匹配与归算</text>
<text x="941.0" y="300" font-size="19" font-weight="500" fill="#1f2328" text-anchor="middle">GAIA 参考星</text>
<text x="941.0" y="326" font-size="19" font-weight="500" fill="#1f2328" text-anchor="middle">底片常数</text>
<text x="941.0" y="360" font-size="17" font-weight="700" fill="#2f6fd6" text-anchor="middle">→ 目标 RA/Dec、O−C</text>
<line x1="784" y1="305.0" x2="832" y2="305.0" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ah-match)"/>
<rect x="1104" y="210" width="206" height="190" rx="14" fill="#f6eaf3" stroke="#a63d8c" stroke-width="2.5"/>
<rect x="1104" y="210" width="206" height="58" rx="14" fill="#a63d8c" stroke="none" stroke-width="1.5"/>
<rect x="1104" y="250" width="206" height="18" rx="0" fill="#a63d8c" stroke="none" stroke-width="1.5"/>
<text x="1207.0" y="249" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">④ O−C 统计</text>
<text x="1207.0" y="300" font-size="19" font-weight="500" fill="#1f2328" text-anchor="middle">剔除野值</text>
<text x="1207.0" y="326" font-size="19" font-weight="500" fill="#1f2328" text-anchor="middle">逐晚统计</text>
<text x="1207.0" y="360" font-size="17" font-weight="700" fill="#a63d8c" text-anchor="middle">→ O−C 数据与统计</text>
<line x1="1050" y1="305.0" x2="1098" y2="305.0" stroke="#a63d8c" stroke-width="3" marker-end="url(#ah-comoc)"/>
<rect x="1370" y="210" width="206" height="190" rx="14" fill="#f6f8fa" stroke="#1f2328" stroke-width="2"/>
<text x="1473.0" y="272" font-size="24" font-weight="700" fill="#1f2328" text-anchor="middle">天体测量结果</text>
<text x="1473.0" y="310" font-size="19" font-weight="400" fill="#57606a" text-anchor="middle">目标位置 + O−C</text>
<text x="1473.0" y="340" font-size="17" font-weight="400" fill="#57606a" text-anchor="middle">单日与全时段汇总</text>
<line x1="1316" y1="305.0" x2="1364" y2="305.0" stroke="#a63d8c" stroke-width="3" marker-end="url(#ah-comoc)"/>
<rect x="748" y="120" width="386" height="58" rx="14" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="941.0" y="157" font-size="19" font-weight="600" fill="#2f6fd6" text-anchor="middle">GAIA DR3 星表 · 卫星历表 (IMCCE)</text>
<line x1="941.0" y1="180" x2="941.0" y2="204" stroke="#2f6fd6" stroke-width="2.5" marker-end="url(#ah-match)"/>
<rect x="1104" y="450" width="472" height="70" rx="14" fill="#ffffff" stroke="#a63d8c" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="1124" y="493" font-size="19" font-weight="600" fill="#a63d8c" text-anchor="start">report（辅助）：由汇总数据绘制 O−C 残差图</text>
<line x1="1207.0" y1="404" x2="1207.0" y2="446" stroke="#a63d8c" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah-comoc)"/>
</svg>
