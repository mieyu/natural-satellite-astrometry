<text x="32" y="98" font-size="21" font-weight="400" fill="#526579" text-anchor="start">四个核心模块 · 按观测夜组织 · 支持整条运行与单步重跑</text>
<g transform="translate(957 57)" fill="none" stroke="#3269b0" stroke-width="1.5"><circle r="12"/><ellipse rx="32" ry="14" transform="rotate(-32)"/><circle cx="25" cy="-13" r="4" fill="#3269b0"/></g>
<rect x="128" y="128" width="624" height="52" rx="14" fill="#f5f8fb" stroke="#dce4ec" stroke-width="1.4"/>
