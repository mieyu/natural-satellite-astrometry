<rect x="128" y="518" width="624" height="84" rx="14" fill="#f5f0fa" stroke="none" stroke-width="1.4"/>
<g transform="translate(152 543)" fill="none" stroke="#7955a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M 3 4 V 28 H 30 M 4 17 H 29"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="21" r="2"/><circle cx="26" cy="14" r="2"/></g>
