<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
<title id="title">NSPA 总体数据流</title>
<desc id="desc">原始 CCD FITS 按顺序经过 pre、detect、match、comoc。GAIA DR3 星表与 IMCCE 卫星历表进入 match；comoc 汇总数据由 report 辅助绘图。</desc>
<defs>
<marker id="arrow-pre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-detect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-match" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-comoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB','Source Han Sans SC',sans-serif">
<rect width="1040" height="800" fill="#ffffff"/>
<text x="32" y="60" font-size="30" font-weight="600" fill="#222222" text-anchor="start">NSPA 天体测量处理流程</text>
<text x="32" y="98" font-size="21" font-weight="400" fill="#555555" text-anchor="start">按观测夜组织数据；四个核心模块可依次运行，也可单步重跑。</text>
<path d="M 32 118 L 1008 118" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<rect x="128" y="128" width="624" height="52" fill="#f7f7f7" stroke="#999999" stroke-width="1.2"/>
<text x="152" y="162" font-size="18" font-weight="600" fill="#555555" text-anchor="start">输入</text>
<text x="216" y="162" font-size="23" font-weight="600" fill="#222222" text-anchor="start">原始 CCD 图像</text>
<text x="728" y="162" font-size="20" font-weight="400" fill="#555555" text-anchor="end">FITS · 逐帧</text>
<path d="M 440 180 L 440 200" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-main)"/>
<text x="76" y="255" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">(1)</text>
<rect x="128" y="206" width="624" height="84" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="152" y="240" font-size="24" font-weight="600" fill="#222222" text-anchor="start">图像预处理</text>
<text x="728" y="239" font-size="19" font-weight="400" fill="#555555" text-anchor="end">pre</text>
<text x="152" y="270" font-size="20" font-weight="400" fill="#555555" text-anchor="start">背景估计与扣除</text>
<text x="728" y="270" font-size="19" font-weight="500" fill="#222222" text-anchor="end">平坦背景 FITS</text>
<path d="M 440 290 L 440 304" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-main)"/>
<text x="76" y="359" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">(2)</text>
<rect x="128" y="310" width="624" height="84" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="152" y="344" font-size="24" font-weight="600" fill="#222222" text-anchor="start">星象检测与定心</text>
<text x="728" y="343" font-size="19" font-weight="400" fill="#555555" text-anchor="end">detect</text>
<text x="152" y="374" font-size="20" font-weight="400" fill="#555555" text-anchor="start">阈值分割 · 修正矩定心</text>
<text x="728" y="374" font-size="19" font-weight="500" fill="#222222" text-anchor="end">星象表 / DS9 region</text>
<path d="M 440 394 L 440 408" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-main)"/>
<text x="76" y="463" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">(3)</text>
<rect x="128" y="414" width="624" height="84" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="152" y="448" font-size="24" font-weight="600" fill="#222222" text-anchor="start">参考星匹配与归算</text>
<text x="728" y="447" font-size="19" font-weight="400" fill="#555555" text-anchor="end">match</text>
<text x="152" y="478" font-size="20" font-weight="400" fill="#555555" text-anchor="start">GAIA 配对 · 底片常数求解</text>
<text x="728" y="478" font-size="19" font-weight="500" fill="#222222" text-anchor="end">目标 RA / Dec 与 O−C</text>
<path d="M 440 498 L 440 512" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-main)"/>
<text x="76" y="567" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">(4)</text>
<rect x="128" y="518" width="624" height="84" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
<text x="152" y="552" font-size="24" font-weight="600" fill="#222222" text-anchor="start">O−C 统计</text>
<text x="728" y="551" font-size="19" font-weight="400" fill="#555555" text-anchor="end">comoc</text>
<text x="152" y="582" font-size="20" font-weight="400" fill="#555555" text-anchor="start">野值剔除 · 按日、按目标统计</text>
<text x="728" y="582" font-size="19" font-weight="500" fill="#222222" text-anchor="end">残差数据与统计表</text>
<rect x="790" y="376" width="218" height="120" fill="#f7f7f7" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="810" y="407" font-size="18" font-weight="600" fill="#555555" text-anchor="start">外部参考数据</text>
<text x="810" y="443" font-size="22" font-weight="500" fill="#222222" text-anchor="start">GAIA DR3 星表</text>
<text x="810" y="475" font-size="21" font-weight="400" fill="#222222" text-anchor="start">IMCCE 卫星历表</text>
<path d="M 790 458 L 760 458" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow-match)"/>
<path d="M 440 602 L 440 642" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-main)"/>
<rect x="128" y="650" width="624" height="88" fill="#f7f7f7" stroke="#999999" stroke-width="1.2"/>
<text x="152" y="683" font-size="18" font-weight="600" fill="#555555" text-anchor="start">归算产物</text>
<text x="152" y="717" font-size="22" font-weight="600" fill="#222222" text-anchor="start">目标天球位置 · O−C 数据 · 单日与全时段统计</text>
<rect x="790" y="650" width="218" height="88" fill="#f7f7f7" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="810" y="682" font-size="21" font-weight="500" fill="#222222" text-anchor="start">report · 辅助</text>
<text x="810" y="716" font-size="22" font-weight="600" fill="#222222" text-anchor="start">O−C 残差图</text>
<path d="M 752 560 L 899 560 L 899 644" fill="none" stroke="#222222" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow-comoc)"/>
<text x="804" y="597" font-size="18" font-weight="400" fill="#555555" text-anchor="start">读取汇总结果</text>
<path d="M 128 771 L 161 771" fill="none" stroke="#555555" stroke-width="1.5"/>
<text x="173" y="777" font-size="18" font-weight="400" fill="#555555" text-anchor="start">主处理流程</text>
<path d="M 328 771 L 361 771" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="373" y="777" font-size="18" font-weight="400" fill="#555555" text-anchor="start">外部输入 / 辅助出图</text>
</g>
</svg>
